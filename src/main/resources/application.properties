spring.application.name=cinema-db-app
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/QuanLyRapChieuPhim?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.default-property-inclusion=non_null

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail-from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.bootstrap-admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

app.payment.transfer-expiry-minutes=${PAYMENT_TRANSFER_EXPIRY_MINUTES:15}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
