<!doctype html>
<html lang="vi" data-theme="light" data-fixed-theme="light">
<head>
  <link rel="icon" type="image/png" href="/ptit-logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAE8E2">
  <title>PTIT Cinema | Tài khoản</title>
  <link rel="stylesheet" href="/ui-preferences.css">
  <style>
    :root{color-scheme:dark;--bg:#11131b;--panel:#1a1d28;--raised:#202431;--border:#303545;--text:#f4f4f6;--muted:#a5a9b8;--gold:#f5b942;--green:#68d6a0;--red:#ff737e;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    :root[data-theme="light"]{--bg:#FAE8E2;--accent:#E4302F}
    *{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;background:radial-gradient(ellipse at 80% -10%,rgb(130 37 49 / 30%),transparent 38rem),var(--bg)}
    button,input{font:inherit}button,a{cursor:pointer}a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgb(245 185 66 / 60%);outline-offset:2px}
    .shell{width:min(1160px,calc(100% - 32px));margin:auto}.top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgb(255 255 255 / 8%)}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;color:#E4302F}.brand-logo{width:42px;height:42px;object-fit:contain}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);gap:40px;align-items:start;padding:56px 0}
    .login-banner{display:block;width:100%;height:auto;clip-path:inset(0 0 0 1% round 16px)}
    :root[data-theme="light"] .login-banner{
      clip-path:none;
      mask-image:linear-gradient(to right,transparent 1%,#000 5%,#000 96%,transparent),linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);
      mask-composite:intersect;
    }
    .card{padding:26px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgb(255 255 255 / 3%),transparent 40%),var(--panel);box-shadow:0 24px 70px rgb(0 0 0 / 25%)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;border-radius:11px;background:#131620}.tab{min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:700}.tab[aria-selected="true"]{background:#DCEFF3;color:var(--text)}
    .form{display:grid;gap:13px;margin-top:20px}.field{display:grid;gap:7px}.field label{color:#d5d7df;font-size:12px;font-weight:700}.field input{width:100%;min-height:45px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#131620;color:var(--text)}.field input:focus{border-color:var(--gold);outline:0}
    .form[hidden]{display:none}
    .primary{min-height:45px;margin-top:5px;border:0;border-radius:10px;background:var(--gold);color:#21190a;font-weight:850}.primary:hover{background:#ffd477}.primary:disabled{opacity:.55;cursor:wait}
    .message{display:none;margin:15px 0 0;padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:#202431;color:var(--text);font-size:13px;line-height:1.5}.message[data-kind=error]{border-color:rgb(255 115 126 / 50%);color:#ffdce0}.message[data-kind=success]{border-color:rgb(104 214 160 / 45%);color:#d7ffea}
    @media(min-width:860px){body{zoom:1.1;min-height:calc(100vh / 1.1)}}
    @media(max-width:859px){.layout{grid-template-columns:1fr;gap:25px;padding:35px 0}.card{padding:21px}}
    .card .form{gap:22px}
    .login-intro{margin:0;font-size:13px;line-height:1.5}
    .card .login-field{position:relative}
    :root[data-theme="light"] .card .login-field input{width:100%;border:0;border-bottom:1px solid #BDBDBD;border-radius:0;min-height:50px;padding:22px 36px 8px 0;background:#fff;color:var(--text)}
    .card .login-field input:focus{border-bottom-color:#E4302F;outline:none}
    .card .login-field label{position:absolute;left:0;top:15px;pointer-events:none;font-size:13px;font-weight:400;color:#666;transition:top .15s,font-size .15s}
    .card .login-field input:focus + label,.card .login-field input:not(:placeholder-shown) + label{top:-6px;font-size:11px}
    .password-toggle{position:absolute;right:0;top:6px;width:32px;height:32px;padding:5px;border:0;background:transparent;color:#86796F;display:grid;place-items:center}
    .password-toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
    .password-toggle[aria-pressed="true"] .eye-slash{display:none}
    :root[data-theme="light"] .card .primary:disabled{background:#D5D5D5;border-color:#D5D5D5;color:#737373;opacity:1;cursor:not-allowed}
    .password-rules{list-style:none;margin:-13px 0 0;padding:0;font-size:11px;line-height:1.8;color:#737373}
    .password-rules li::before{content:'✓';display:inline-grid;place-items:center;width:12px;height:12px;margin-right:6px;border:1px solid currentColor;border-radius:50%;font-size:9px}
    .password-rules li[data-valid="true"]{color:#22764C}
    .password-rules li[data-valid="true"]::before{color:#fff;background:#4BC865;border-color:#4BC865}
    .field-error{display:block;font-size:11px;line-height:1.5;color:#E4302F;margin-top:3px}
    .field-error[hidden]{display:none}
    :root[data-theme="light"] .card .login-field input[aria-invalid="true"]{border-bottom-color:#E4302F;color:#E4302F}
    .card .login-field input[aria-invalid="true"] + label{color:#E4302F}
  </style>
<link rel="stylesheet" href="/login-font.css"></head>
<body>
  <header class="shell top">
    <div class="brand"><img class="brand-logo" src="/ptit-logo.png" alt="Logo PTIT" width="42" height="42"><span>PTIT Cinema</span></div>
  </header>
  <main class="shell layout">
    <img class="login-banner" src="/login-booking-banner.png" alt="PTIT Cinema – Trang đặt vé" width="1879" height="837">
    <section class="card" aria-label="Đăng nhập hoặc đăng ký">
      <div class="tabs" role="tablist">
        <button id="login-tab" class="tab" type="button" role="tab" aria-selected="true">Đăng nhập</button>
        <button id="register-tab" class="tab" type="button" role="tab" aria-selected="false">Đăng ký</button>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <form id="login-form" class="form">
        <p class="login-intro">Vui lòng đăng nhập để đặt vé</p>
        <div class="login-field"><input id="login-identifier" type="text" autocomplete="username" maxlength="254" placeholder=" " aria-describedby="login-identifier-error" required><label for="login-identifier">Số điện thoại / Email</label><span id="login-identifier-error" class="field-error" hidden>Sai định dạng</span></div>
        <div class="login-field"><input id="login-password" type="password" autocomplete="current-password" placeholder=" " required><label for="login-password">Mật khẩu</label>
          <button id="toggle-login-password" class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="login-password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 21 21 3"/></svg></button>
        </div>
        <button class="primary" type="submit" disabled>Đăng nhập</button>
      </form>
      <form id="register-form" class="form" hidden>
        <div class="login-field"><input id="register-name" autocomplete="name" maxlength="50" placeholder=" " required><label for="register-name">Họ và tên</label></div>
        <div class="login-field"><input id="register-phone" type="tel" autocomplete="tel" maxlength="50" placeholder=" " required><label for="register-phone">Số điện thoại</label></div>
        <div class="login-field"><input id="register-email" type="email" autocomplete="email" maxlength="50" placeholder=" " required><label for="register-email">Email</label></div>
        <div class="login-field"><input id="register-password" type="password" autocomplete="new-password" minlength="8" maxlength="16" placeholder=" " aria-describedby="password-rules" required><label for="register-password">Mật khẩu</label>
          <button id="toggle-register-password" class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="register-password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 21 21 3"/></svg></button>
        </div>
        <ul id="password-rules" class="password-rules" aria-label="Điều kiện mật khẩu">
          <li id="rule-length">Có 8 đến 16 ký tự</li>
          <li id="rule-case">Ít nhất 1 chữ in hoa, 1 chữ thường</li>
          <li id="rule-special">Ít nhất 1 chữ số, 1 ký tự đặc biệt</li>
        </ul>
        <button class="primary" type="submit" disabled>Đăng ký</button>
      </form>
    </section>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    let csrf = null;
    let loginPending = false;
    let registerPending = false;
    function validPhone(value) {
      return /^[+0-9\s().-]+$/.test(value) && /^\+?[0-9]{7,15}$/.test(value.replace(/[^0-9+]/g, ''));
    }
    function validEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }
    function identifierValid() {
      const value = $('#login-identifier').value.trim();
      return value.includes('@') ? validEmail(value) : validPhone(value);
    }
    function validateLoginIdentifier() {
      const input = $('#login-identifier');
      const invalid = Boolean(input.value.trim()) && !identifierValid();
      input.setAttribute('aria-invalid', String(invalid));
      input.setCustomValidity(invalid ? 'Sai định dạng số điện thoại / email.' : '');
      $('#login-identifier-error').hidden = !invalid;
    }
    function updateLoginButton() {
      validateLoginIdentifier();
      $('#login-form button[type=submit]').disabled = loginPending || !identifierValid() || !$('#login-password').value;
    }
    $('#login-form').addEventListener('input', updateLoginButton);
    $('#login-form').addEventListener('change', updateLoginButton);
    window.addEventListener('pageshow', updateLoginButton);
    for (const prefix of ['login', 'register']) {
      $('#toggle-' + prefix + '-password').addEventListener('click', () => {
        const input = $('#' + prefix + '-password');
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        $('#toggle-' + prefix + '-password').setAttribute('aria-pressed', String(showing));
        $('#toggle-' + prefix + '-password').setAttribute('aria-label', showing ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      });
    }
    function updateRegisterButton() {
      const password = $('#register-password');
      const value = password.value;
      const rules = {
        length: value.length >= 8 && value.length <= 16,
        case: /[A-Z]/.test(value) && /[a-z]/.test(value),
        special: /[0-9]/.test(value) && /[^A-Za-z0-9\s]/.test(value)
      };
      for (const [name, valid] of Object.entries(rules)) {
        $('#rule-' + name).dataset.valid = String(valid);
      }
      const passwordValid = Object.values(rules).every(Boolean);
      password.setCustomValidity(value && !passwordValid ? 'Mật khẩu chưa đáp ứng đủ các điều kiện.' : '');
      password.setAttribute('aria-invalid', String(Boolean(value) && !passwordValid));
      const phone = $('#register-phone');
      const email = $('#register-email');
      const phoneInvalid = Boolean(phone.value.trim()) && !validPhone(phone.value.trim());
      const emailInvalid = Boolean(email.value.trim()) && !validEmail(email.value.trim());
      phone.setCustomValidity(phoneInvalid ? 'Sai định dạng số điện thoại.' : '');
      email.setCustomValidity(emailInvalid ? 'Sai định dạng email.' : '');
      phone.setAttribute('aria-invalid', String(phoneInvalid));
      email.setAttribute('aria-invalid', String(emailInvalid));
      $('#register-form button[type=submit]').disabled = registerPending || !passwordValid ||
        !$('#register-name').value.trim() || !phone.value.trim() || !email.value.trim() ||
        !$('#register-form').checkValidity();
    }
    $('#register-form').addEventListener('input', updateRegisterButton);
    $('#register-form').addEventListener('change', updateRegisterButton);
    window.addEventListener('pageshow', updateRegisterButton);
    updateRegisterButton();
    updateLoginButton();
    async function request(url, options = {}) {
      const settings = { ...options, headers: { ...(options.headers || {}) } };
      if (settings.method && settings.method !== 'GET') {
        csrf ||= await fetch('/api/auth/csrf').then(response => response.json());
        settings.headers[csrf.headerName] = csrf.token;
      }
      const response = await fetch(url, settings);
      const body = response.status === 204 ? '' : await response.text();
      let data = null;
      if (body) {
        try { data = JSON.parse(body); } catch {
          if (response.status >= 500) {
            throw new Error('Máy chủ gặp lỗi. Hãy kiểm tra log Spring Boot; nếu chưa chuyển sang đăng nhập bằng số điện thoại, cần import migration V2.');
          }
        }
      }
      if (!response.ok) throw new Error(data?.message || `Yêu cầu chưa thể hoàn tất (HTTP ${response.status}).`);
      return data;
    }
    function showMessage(text, kind = 'success') {
      const element = $('#message'); element.textContent = text; element.dataset.kind = kind; element.style.display = 'block';
    }
    function switchTab(register) {
      $('#login-tab').setAttribute('aria-selected', String(!register));
      $('#register-tab').setAttribute('aria-selected', String(register));
      $('#login-form').hidden = register; $('#register-form').hidden = !register;
      $('#message').style.display = 'none';
    }
    function safeNext(value) {
      return value && value.startsWith('/') && !value.startsWith('//') && !value.includes('\\') ? value : '/DatVe.html';
    }
    $('#login-tab').addEventListener('click', () => switchTab(false));
    $('#register-tab').addEventListener('click', () => switchTab(true));
    $('#register-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (registerPending) return;
      registerPending = true;
      updateRegisterButton();
      try {
        const result = await request('/api/auth/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({
          hoTen: $('#register-name').value.trim(), sdt: $('#register-phone').value.trim(),
          matKhau: $('#register-password').value, email: $('#register-email').value.trim()
        }) });
        switchTab(false);
        $('#login-identifier').value = $('#register-phone').value.trim();
        updateLoginButton();
        showMessage(result.message);
      } catch (error) { showMessage(error.message, 'error'); }
      finally { registerPending = false; updateRegisterButton(); }
    });
    $('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (loginPending) return;
      loginPending = true;
      updateLoginButton();
      try {
        const account = await request('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({
          identifier: $('#login-identifier').value.trim(), matKhau: $('#login-password').value
        }) });
        const next = new URLSearchParams(location.search).get('next');
        location.href = next ? safeNext(next) : (account.vaiTro === 'ADMIN' ? '/QuanTri.html' : account.vaiTro === 'STAFF' ? '/Database.html' : '/DatVe.html');
      } catch (error) { showMessage(error.message, 'error'); }
      finally { loginPending = false; updateLoginButton(); }
    });
    request('/api/auth/me').then(account => { if (account.vaiTro === 'ADMIN') location.href = '/QuanTri.html'; else if (account.vaiTro === 'CUSTOMER') location.href = '/DatVe.html'; }).catch(() => {});
  </script>
  <script src="/ui-preferences.js"></script>
</body>
</html>
