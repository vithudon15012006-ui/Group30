<!doctype html>
<html lang="vi">
<head>
  <link rel="icon" type="image/png" href="/ptit-logo.png">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <title>PTIT Cinema | Phòng chiếu và giá vé</title>
  <link rel="stylesheet" href="/ui-preferences.css">
  <style>
    :root{color-scheme:dark;--bg:#11131b;--panel:#1a1d28;--raised:#202431;--border:#303545;--text:#f4f4f6;--muted:#a5a9b8;--gold:#f5b942;--green:#68d6a0;--red:#ff737e;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background:radial-gradient(ellipse at 85% -15%,rgb(130 37 49 / 22%),transparent 42rem),var(--bg)}button,input,select{font:inherit}button,a{cursor:pointer}a{color:var(--gold);text-decoration:none}.shell{width:min(1200px,calc(100% - 32px));margin:auto}
    .top{min-height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgb(255 255 255 / 8%)}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase}.nav{display:flex;align-items:center;gap:14px}
    .hero{padding:35px 0 20px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{margin:8px 0;font-size:clamp(29px,4vw,42px);letter-spacing:-.04em}.hero p,.sub,.help{color:var(--muted)}.hero p{line-height:1.55}
    .message{display:none;margin:0 0 16px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;line-height:1.5}.message[data-kind=error]{border-color:#87414a;color:#ffdce0}.message[data-kind=success]{border-color:#3a795b;color:#d7ffea}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:48px}.panel{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 18px 50px #0002}.wide{grid-column:1/-1}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:19px 21px;border-bottom:1px solid var(--border)}h2{margin:0;font-size:17px}.sub{margin:5px 0 0;font-size:12px}.body{padding:20px 21px}.form{display:grid;gap:13px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:7px;min-width:0}.field label{font-size:12px;font-weight:700;color:#d5d7df}.field input,.field select{width:100%;min-height:43px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#131620;color:var(--text)}.field input:focus,.field select:focus{border-color:var(--gold);outline:0}.field-full{grid-column:1/-1}
    .button{min-height:38px;padding:8px 12px;border:0;border-radius:9px;background:var(--gold);color:#21190a;font-weight:800}.button.secondary{border:1px solid var(--border);background:var(--raised);color:var(--text)}.button.danger{border:1px solid #87414a;background:#382027;color:#ffdce0}.button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px}.help{font-size:12px;line-height:1.55}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{padding:13px;border:1px solid var(--border);border-radius:11px;background:var(--raised)}.stat strong{display:block;margin-top:5px;color:var(--gold);font-size:18px}.stat span{color:var(--muted);font-size:11px}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}td{font-size:12px}tbody tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 7px;border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:10px}.empty{padding:22px;color:var(--muted);text-align:center}
    @media(max-width:800px){.shell{width:calc(100% - 24px)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.fields{grid-template-columns:1fr}.nav{gap:8px;font-size:11px}.head,.body{padding:15px}}
  </style>
  <link rel="stylesheet" href="/admin-shell.css">
<link rel="stylesheet" href="/vietnamese-font.css"></head>
<body class="admin-shell">
  <header class="admin-sidebar">
    <a class="admin-brand" href="/QuanTri.html">
      <img src="/ptit-logo.png" width="40" height="40" alt="">
      <span>PTIT Cinema</span>
    </a>
    <nav class="admin-menu" aria-label="Điều hướng quản trị">
      <a href="/QuanTri.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a>
      <a href="/Database.html"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><span>Quản lý dữ liệu</span></a>
      <a href="/QuanTriLichChieu.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18m-13 4h3m3 0h3"/></svg><span>Phòng chiếu và giá vé</span></a>
      <a href="/QuanTriThanhToan.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20M6 15h5"/></svg><span>Thanh toán</span></a>
      <button id="logout" type="button">Đăng xuất</button>
    </nav>
  </header>
  <header class="admin-topbar" data-ui-preferences><span class="admin-page-label">Phòng chiếu và giá vé</span></header>
  <main class="shell">
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div class="grid room-price-layout">
      <section class="panel">
        <div class="head"><div><h2>Giá vé</h2></div></div>
        <div class="body">
          <form id="prices-form" class="form">
            <div class="fields">
              <div class="field"><label for="price-standard">Ghế thường (đồng)</label><input id="price-standard" type="number" min="1000" max="10000000" step="1000" required></div>
              <div class="field"><label for="price-vip">Ghế VIP (đồng)</label><input id="price-vip" type="number" min="1000" max="10000000" step="1000" required></div>
            </div>
            <div class="actions"><button class="button" type="submit">Lưu giá vé</button></div>

          </form>
        </div>
      </section>
      <section class="panel">
        <div class="head"><h2>Phòng chiếu</h2></div>
        <div class="body"><div id="rooms" class="stats"></div></div>
      </section>
    </div>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);
    let csrf=null;
    async function api(url,options={}){const settings={...options,headers:{...(options.headers||{})}};if(settings.method&&settings.method!=='GET'){csrf||=await fetch('/api/auth/csrf').then(r=>r.json());settings.headers[csrf.headerName]=csrf.token}const response=await fetch(url,settings);const data=response.status===204?null:await response.json();if(!response.ok)throw new Error(data?.message||'Yêu cầu chưa thể hoàn tất.');return data}
    function notice(text){const el=$('#message');el.textContent=text;el.style.display='block'}
    async function initialize(){const me=await api('/api/auth/me');if(me.vaiTro!=='ADMIN'){location.href='/DangNhap.html';return}const options=await api('/api/admin/schedules/options');$('#price-standard').value=options.prices.giaThuong;$('#price-vip').value=options.prices.giaVip;const host=$('#rooms');for(const room of options.rooms){const card=document.createElement('div');card.className='stat';const name=document.createElement('span');name.textContent=[room.tenPhong||room.maPhong,room.loaiPhong].filter(Boolean).join(' · ');const seats=document.createElement('strong');seats.textContent=room.soGhe+' ghế';const shows=document.createElement('span');shows.textContent=room.soSuatChieu+' suất đã lên lịch';card.append(name,seats,shows);host.append(card)}if(!options.rooms.length)host.textContent='Chưa có phòng chiếu.'}
    $('#prices-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('[type=submit]');button.disabled=true;try{await api('/api/admin/schedules/prices',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({giaThuong:Number($('#price-standard').value),giaVip:Number($('#price-vip').value)})});notice('Đã cập nhật giá vé.')}catch(error){notice(error.message)}finally{button.disabled=false}});
    $('#logout').addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST'});location.href='/DangNhap.html'}catch(error){notice(error.message)}});
    initialize().catch(error=>notice(error.message));
  </script>
  <script src="/ui-preferences.js"></script>
  <script src="/admin-account.js"></script>
</body>
</html>
