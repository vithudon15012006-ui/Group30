<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTIT Cinema – Nhóm 30</title>
  <link rel="icon" href="/ptit-logo.png">
  <link rel="stylesheet" href="/management.css">
  <link rel="stylesheet" href="/cinema-theme.css">
  <script src="/management.js" defer></script>
</head>
<body class="admin">
  <header class="mast">
    <div class="site-bar">
      <a class="site-brand" href="/"><img src="/ptit-logo.png" width="44" height="44" alt=""><span>PTIT Cinema<small>Nhóm 30</small></span></a>
      <nav class="site-nav" aria-label="Điều hướng chính">
        <a href="/">Đặt vé</a>
        <a href="/Database.html" aria-current="page">Quản lý</a>
        <a id="admin-home" href="/QuanTri.html" hidden>Quản trị</a>
        <button id="logout" type="button" hidden>Đăng xuất</button>
      </nav>
    </div>
  </header>
  <main>
    <h1>Quản lý dữ liệu rạp chiếu phim</h1>
    <section aria-labelledby="table-title">
      <div class="toolbar">
        <label for="catalog">Danh mục</label>
        <select id="catalog"></select>
      </div>
      <h2 id="table-title">Phim</h2>
      <p id="catalog-workflow" hidden><a id="catalog-link"></a></p>
      <form id="search-form" class="toolbar">
        <input id="search" type="search" aria-label="Tìm trong danh mục" placeholder="Tìm theo mã, tên hoặc nội dung">
        <button type="submit">Tìm</button>
        <button type="button" id="reload">Tải lại</button>
        <button type="button" id="add">Thêm mới</button>
      </form>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <div class="table-wrap"><table><thead id="headers"></thead><tbody id="rows"></tbody></table></div>
      <div class="toolbar pagination" id="pagination" hidden>
        <button type="button" id="previous">Trước</button><span id="page"></span><button type="button" id="next">Sau</button>
      </div>
    </section>
    <dialog id="editor" aria-labelledby="editor-title">
      <h2 id="editor-title"></h2>
      <form id="edit-form">
        <div class="fields" id="fields"></div>
        <p id="edit-message" class="message error" role="alert" hidden></p>
        <div class="toolbar dialog-actions">
          <button type="button" id="cancel-edit" autofocus>Hủy</button>
          <button type="submit" id="save">Thêm</button>
        </div>
      </form>
    </dialog>
    <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
      <h2 id="delete-title">Bạn muốn xóa vĩnh viễn?</h2>
      <p id="delete-description"></p>
      <p id="delete-message" class="message error" role="alert" hidden></p>
      <div class="toolbar dialog-actions">
        <button type="button" id="cancel-delete" autofocus>Hủy</button>
        <button type="button" id="confirm-delete" class="danger">Xóa vĩnh viễn</button>
      </div>
    </dialog>
    <dialog id="details">
      <div class="toolbar"><h2 id="detail-title">Chi tiết</h2><button id="close-details" type="button">Đóng</button></div>
      <div id="detail-content"></div>
    </dialog>
  </main>
</body>
</html>
