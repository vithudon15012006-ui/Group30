<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11131b"><title>PTIT Cinema | Kích hoạt tài khoản</title><link rel="stylesheet" href="/ui-preferences.css">
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#11131b;color:#f4f4f6}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(ellipse at 75% 0%,rgb(130 37 49 / 24%),transparent 35rem),#11131b}.card{width:min(460px,calc(100% - 28px));padding:30px;border:1px solid #303545;border-radius:20px;background:#1a1d28;box-shadow:0 24px 70px #0005}.mark{display:grid;width:46px;height:46px;place-items:center;border-radius:14px;background:#f5b942;color:#21190a;font-weight:900}h1{margin:20px 0 7px;font-size:25px}p{color:#a5a9b8;line-height:1.6}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;font-weight:700}.field input{min-height:45px;padding:10px 12px;border:1px solid #303545;border-radius:10px;background:#131620;color:#f4f4f6}.button{width:100%;min-height:45px;margin-top:8px;border:0;border-radius:10px;background:#f5b942;color:#21190a;font-weight:800}.message{color:#68d6a0;line-height:1.5}
</style></head>
<body><main class="card"><span class="mark">P</span><h1>Kích hoạt tài khoản nhân viên</h1><p>Đặt mật khẩu tối thiểu 12 ký tự để hoàn tất kích hoạt và xác minh email.</p><form id="form"><div class="field"><label for="password">Mật khẩu mới</label><input id="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div><div class="field"><label for="confirm">Nhập lại mật khẩu</label><input id="confirm" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div><button class="button" type="submit">Kích hoạt tài khoản</button></form><p id="message" class="message" role="status" aria-live="polite"></p></main>
<script>
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();const message=document.querySelector('#message');const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){message.textContent='Hai mật khẩu chưa khớp.';message.style.color='#ff9ba3';return}try{const csrf=await fetch('/api/auth/csrf').then(r=>r.json());const response=await fetch('/api/auth/set-staff-password',{method:'POST',headers:{'Content-Type':'application/json',[csrf.headerName]:csrf.token},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),matKhau:password})});const result=await response.json();if(!response.ok)throw new Error(result.message||'Không thể kích hoạt tài khoản.');message.textContent=result.message;setTimeout(()=>location.href='/DangNhap.html',1800)}catch(error){message.textContent=error.message;message.style.color='#ff9ba3'}});
</script><script src="/ui-preferences.js"></script></body></html>
