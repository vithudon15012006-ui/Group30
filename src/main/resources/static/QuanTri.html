<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | PTIT Cinema</title>
  <link rel="icon" href="/ptit-logo.png">
  <link rel="stylesheet" href="/cinema-theme.css">
  <link rel="stylesheet" href="/management.css">
  <link rel="stylesheet" href="/ui-preferences.css">
  <link rel="stylesheet" href="/admin-shell.css">
</head>
<body class="admin admin-shell">
  <header class="admin-sidebar">
    <a class="admin-brand" href="/QuanTri.html">
      <img src="/ptit-logo.png" width="40" height="40" alt="">
      <span>PTIT Cinema</span>
    </a>
    <nav class="admin-menu" aria-label="Điều hướng quản trị">
      <a href="/QuanTri.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a>
      <a href="/Database.html"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><span>Quản lý dữ liệu</span></a>
      <a href="/QuanTriLichChieu.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18m-13 4h3m3 0h3"/></svg><span>Phòng chiếu và giá vé</span></a>
      <a href="/QuanTriThanhToan.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20M6 15h5"/></svg><span>Thanh toán</span></a>
      <button id="logout" type="button">Đăng xuất</button>
    </nav>
  </header>
  <header class="admin-topbar" data-ui-preferences><span class="admin-page-label">Tổng quan rạp chiếu phim</span></header>
  <main>
    <p id="dashboard-error" class="dashboard-error" role="status" hidden></p>
    <dl class="dashboard-metrics" aria-label="Tổng quan thanh toán">
      <div><dt>Tổng doanh thu</dt><dd id="total-revenue">—</dd></div>
      <div><dt>Doanh thu hôm nay</dt><dd id="today-revenue">—</dd></div>
      <div><dt>Giao dịch đã thanh toán</dt><dd id="paid-orders">—</dd></div>
      <div><dt>Đơn chờ thanh toán</dt><dd id="pending-orders">—</dd></div>
    </dl>
    <section class="dashboard-recent" aria-labelledby="recent-title">
      <div class="dashboard-section-head"><h2 id="recent-title">Giao dịch gần đây</h2><a href="/QuanTriThanhToan.html">Xem tất cả →</a></div>
      <div class="table-wrap">
        <table><thead><tr><th>Mã hóa đơn</th><th>Khách hàng</th><th>Thời gian</th><th>Hình thức</th><th>Thành tiền</th><th>Trạng thái</th></tr></thead>
          <tbody id="recent-payments"><tr><td colspan="6">Đang tải giao dịch…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const loginUrl = '/DangNhap.html?next=%2FQuanTri.html';
    const errorBox = document.getElementById('dashboard-error');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    async function loadRecentPayments() {
      const host = document.getElementById('recent-payments');
      try {
        const response = await fetch('/api/admin/payments?status=ALL');
        if (!response.ok) throw new Error();
        const payments = await response.json();
        const latest = [...payments].sort((a, b) =>
          String(b.thoiGianTao || '').localeCompare(String(a.thoiGianTao || ''))).slice(0, 6);
        host.replaceChildren();
        const states = {PAID: 'Đã thanh toán', PENDING: 'Chờ xác nhận', EXPIRED: 'Hết hạn', CANCELLED: 'Đã hủy'};
        const money = new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'});
        for (const payment of latest) {
          const row = host.insertRow();
          const values = [payment.maHoaDon, payment.tenKhachHang || '—',
            payment.thoiGianTao ? new Date(payment.thoiGianTao).toLocaleString('vi-VN') : '—',
            payment.hinhThucThanhToan || '—', money.format(payment.thanhTien)];
          for (const value of values) row.insertCell().textContent = value;
          const badge = document.createElement('span');
          badge.className = 'dashboard-state';
          badge.dataset.status = payment.trangThaiThanhToan;
          badge.textContent = states[payment.trangThaiThanhToan] || payment.trangThaiThanhToan;
          row.insertCell().append(badge);
        }
        if (!latest.length) {
          const cell = host.insertRow().insertCell();
          cell.colSpan = 6;
          cell.textContent = 'Chưa có giao dịch.';
        }
      } catch {
        host.replaceChildren();
        const cell = host.insertRow().insertCell();
        cell.colSpan = 6;
        cell.textContent = 'Không thể tải giao dịch. Vui lòng tải lại trang.';
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch('/api/admin/payments/summary');
        if (response.status === 401 || response.status === 403) {
          const session = await fetch('/api/auth/me');
          location.replace(session.ok ? '/Database.html' : loginUrl);
          return;
        }
        if (!response.ok) throw new Error('Không thể tải số liệu thanh toán.');
        const summary = await response.json();
        const money = new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND'});
        document.getElementById('total-revenue').textContent = money.format(summary.tongDoanhThu);
        document.getElementById('today-revenue').textContent = money.format(summary.doanhThuHomNay);
        document.getElementById('paid-orders').textContent = summary.soGiaoDichDaThanhToan;
        document.getElementById('pending-orders').textContent = summary.soDonChoThanhToan;
        await loadRecentPayments();
      } catch {
        showError('Không thể tải số liệu thanh toán. Vui lòng tải lại trang.');
      }
    }

    document.getElementById('logout').addEventListener('click', async () => {
      try {
        const tokenResponse = await fetch('/api/auth/csrf');
        if (!tokenResponse.ok) throw new Error();
        const token = await tokenResponse.json();
        const response = await fetch('/api/auth/logout', {
          method: 'POST', headers: {[token.headerName]: token.token}
        });
        if (!response.ok) throw new Error();
        location.replace('/DangNhap.html');
      } catch {
        showError('Không thể đăng xuất. Vui lòng thử lại.');
      }
    });
    loadDashboard();
  </script>
  <script src="/ui-preferences.js"></script>
  <script src="/admin-account.js"></script>
</body>
</html>
